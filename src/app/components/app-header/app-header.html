<nav class="navbar navbar-expand-lg app-nav" aria-label="Navegação principal">
  <div class="container-fluid app-container">
    <a class="navbar-brand brand" routerLink="/overview">
      <span class="brand-mark"><i class="bi bi-compass"></i></span>
      <span>field<span class="brand-accent">ops</span></span>
    </a>
    <button class="navbar-toggler" type="button" (click)="menuAberto = !menuAberto"
      [attr.aria-expanded]="menuAberto" aria-label="Abrir ou fechar menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="menuAberto">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/overview" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="fecharMenus()">
            <i class="bi bi-grid-1x2-fill"></i> Visão geral
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/inspections" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="fecharMenus()">
            <i class="bi bi-clipboard-check"></i> Inspeções
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/planning" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="fecharMenus()">
            <i class="bi bi-calendar3"></i> Planejamento
          </a>
        </li>
        <li class="nav-item dropdown" [class.show]="cadastrosAberto">
          <button class="nav-link dropdown-toggle" [class.active]="cadastrosAberto || cadastrosAtivo" type="button"
            (click)="cadastrosAberto = !cadastrosAberto" [attr.aria-expanded]="cadastrosAberto">
            <i class="bi bi-buildings"></i> Cadastros
          </button>
          <ul class="dropdown-menu dropdown-menu-end" [class.show]="cadastrosAberto">
            <li><a class="dropdown-item" routerLink="/catalog/clients" (click)="fecharMenus()">Clientes</a></li>
            <li><a class="dropdown-item" routerLink="/catalog/locations" (click)="fecharMenus()">Locais</a></li>
            <li><a class="dropdown-item" routerLink="/catalog/equipment" (click)="fecharMenus()">Equipamentos</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" routerLink="/checklists" (click)="fecharMenus()">Modelos de checklist</a></li>
          </ul>
        </li>
      </ul>
    </div>
    <div class="account-controls" *ngIf="auth.currentUser() as user">
      <div class="user-chip">
        <span class="avatar">{{ user.initials }}</span>
        <span class="user-copy"><strong>{{ user.name }}</strong><small>{{ user.roleLabel }}</small></span>
      </div>
      <button class="logout-button" type="button" (click)="logout()">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sair</span>
      </button>
    </div>
  </div>
</nav>
